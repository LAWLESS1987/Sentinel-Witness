name: checks

# Does README.md name files this branch has, and does the Python here compile? Those steps read the branch and
# fetch nothing. The test of the old core copy (added 2026-11-14) installs the three packages the core imports.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The check's own tests, driven both ways
        run: python3 checks/test_readme_files.py
      - name: README.md and this branch agree
        run: python3 checks/readme_files.py
      # The old core copy is imported whole by its test, so it needs the three packages it imports at the top;
      # the ranges are the ones in requirements.txt (requests is for the trading bridge and is not needed here).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: What the core copy's test needs
        run: python -m pip install "flask>=3.0,<4.0" "cryptography>=42.0,<44.0" "waitress>=3.0,<4.0"
      - name: The old core copy answers its two write routes on loopback only, and its API listens there by default
        run: python -B tests/test_core_loopback.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: The JavaScript that can be loaded from this branch
        # node --test passes a glob that matches nothing as "tests 0", exit 0; no test file is not a pass.
        run: |
          set -- tests/*.test.mjs
          if [ ! -e "$1" ]; then echo "no test file found -- that is not a pass"; exit 1; fi
          node --test "$@"
