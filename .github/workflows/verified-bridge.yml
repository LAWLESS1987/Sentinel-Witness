name: verified profit and gift bridge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Exchange evidence, replay, rollback and gifts
        run: python -m unittest -v test_trading_bridge test_exchange_evidence
