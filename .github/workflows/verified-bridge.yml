name: verified profit and gift bridge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Exchange evidence, replay, rollback and gifts
        run: python -m unittest -v test_trading_bridge test_exchange_evidence
      - name: Ethics admission, warnings, authenticated recovery and capability regressions
        run: python -m pytest tests -v
      # AN1 sits at the root, outside tests/ and trader/, so no step ran it until 2026-11-09 (audit of all repos,
      # his "Yes, additive only"). Its exit code is its verdict.
      - name: AN1 -- the nonce reservation is atomic (one winner among concurrent reservers)
        run: python test_an1_nonce_atomic.py
  # trader/ (2026-10-05): the trading program copied from covenant. Each suite
  # is a script whose exit code is its verdict. This runner has no covenant, so
  # the checks that need covenant's ledger or seal service print NOT RUN; every
  # other check runs, and any red suite fails the job after all have run.
  trader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Trader suites -- waiver, witness, gates, caps, reserve, venues, Rule 5
        working-directory: trader
        run: |
          fail=0
          for t in test_*.py quant/test_*.py; do
            echo "::group::$t"
            python "$t" || { echo "::error::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
